<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Zpice Live Builder</title>
<style>
body {
  background: #111;
  color: white;
  font-family: Arial;
  text-align: center;
}
textarea {
  width: 90%;
  height: 160px;
  margin: 10px;
}
input, button {
  padding: 10px;
  margin: 5px;
}
button {
  background: #00ffcc;
  cursor: pointer;
}
iframe {
  width: 90%;
  height: 250px;
  border: 2px solid #00ffcc;
}
</style>
</head>
<body>

<h2>🌐 ZPICE LIVE PUBLISHER</h2>

<textarea id="htmlInput" placeholder="Paste HTML here..."></textarea><br>
<input id="name" placeholder="mysite"><br>

<button onclick="publish()">🚀 Publish Live</button>

<h3 id="status"></h3>

<iframe id="preview"></iframe>

<script>
async function publish() {
  let html = document.getElementById("htmlInput").value;
  let name = document.getElementById("name").value;

  if (!html || !name) {
    alert("Fill everything!");
    return;
  }

  let res = await fetch("/publish", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({ name, html })
  });

  let data = await res.json();

  document.getElementById("status").innerHTML =
    "✅ Live at: " + data.url;

  document.getElementById("preview").src = data.url;
}
</script>

</body>
</html>
